<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jakarta Agentic AI — Slides</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Payara palette — extracted from payara.fish frontend.css */
:root{
  --orange:#ee992f; --orange-                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        csoft:#f6a844; --orange-subtle:#fcebd5;
  --navy:#001b27; --navy-2:#00131b; --navy-3:#0a2a3a; --navy-soft:#12384c;
  --ink:#e8edf0; --muted:#9fb2bc; --faint:#6d8794;
  --ok:#5ad18a; --bad:#ff7b87;
  --sans:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",Consolas,monospace;
}
*{box-sizing:border-box} html,body{height:100%}
body{margin:0;background:var(--navy-2);font-family:var(--sans);color:var(--ink);overflow:hidden}

#stage{position:absolute;top:50%;left:50%;width:1280px;height:720px;transform-origin:center;transform:translate(-50%,-50%) scale(1)}
.slide{position:absolute;inset:0;padding:64px 84px;display:none;flex-direction:column;background:
  radial-gradient(1100px 600px at 85% -10%, rgba(238,153,47,.09), transparent 60%),
  linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 70%)}
.slide.active{display:flex;animation:slidein .3s ease}
@keyframes slidein{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}

/* header pattern */
.kicker{font-size:15px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--orange);margin:0 0 10px;display:flex;align-items:center;gap:10px}
.kicker::before{content:"";width:26px;height:3px;background:var(--orange);border-radius:2px}
h2{font-size:40px;margin:0 0 26px;font-weight:700;letter-spacing:-.5px;line-height:1.15}
h2 em{color:var(--orange);font-style:normal}
p,li{font-size:21px;line-height:1.55;color:var(--ink)}
li{margin:9px 0}
ul,ol{margin:0;padding-left:30px}
li::marker{color:var(--orange);font-weight:700}
strong{color:#fff}
.muted{color:var(--muted)} .small{font-size:16.5px} .xsmall{font-size:14px}
code{font-family:var(--mono);font-size:.85em;background:rgba(255,255,255,.08);padding:2px 7px;border-radius:6px;color:#ffd9a8}

/* code panels */
pre{background:rgba(0,0,0,.42);border:1px solid var(--navy-soft);border-radius:14px;padding:20px 24px;margin:0;overflow:hidden}
pre code{background:none;padding:0;color:#dce7ec;font-size:16px;line-height:1.55;display:block;white-space:pre}
pre.sm code{font-size:13.5px;line-height:1.5}
.tok-kw{color:#7fc8ef;font-weight:500}.tok-ann{color:var(--orange);font-weight:600}
.tok-str{color:#a8d977}.tok-cmt{color:#6d8794;font-style:italic}.tok-num{color:#f2b8d0}
.tok-key{color:#7fc8ef}.tok-val{color:#a8d977}
.panel-label{font-family:var(--mono);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);margin:0 0 8px}

/* layout helpers */
.cols{display:flex;gap:34px;flex:1;min-height:0}
.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
.center{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;flex:1}
.grow{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
/* when a row of columns must also fill height, keep it a ROW (grow alone forces column) */
.cols.grow{flex-direction:row;justify-content:flex-start;align-items:stretch}

/* cards & chips */
.card{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:20px 24px}
.card h3{margin:0 0 8px;font-size:20px;color:var(--orange)}
.card p,.card li{font-size:17px;margin:0}
.card ul{margin-top:6px}
.chip{display:inline-block;background:rgba(238,153,47,.15);border:1px solid rgba(238,153,47,.4);color:var(--orange-soft);border-radius:100px;padding:5px 16px;font-size:15px;font-weight:600;margin:4px 6px 4px 0}
.check{color:var(--ok);font-weight:700} .cross{color:var(--bad);font-weight:700}

/* tables */
table{border-collapse:separate;border-spacing:0;width:100%;font-size:17px;border:1px solid rgba(255,255,255,.14);border-radius:12px;overflow:hidden}
th{background:rgba(238,153,47,.16);color:var(--orange-soft);text-align:left;padding:10px 16px;font-size:14.5px;letter-spacing:.5px;text-transform:uppercase}
td{padding:10px 16px;border-top:1px solid rgba(255,255,255,.09);vertical-align:top}
td code{white-space:nowrap}

/* phase flow diagram */
.flow{display:flex;align-items:center;gap:14px;justify-content:center;margin:26px 0}
.fbox{border-radius:14px;padding:20px 26px;text-align:center;font-family:var(--mono);font-size:20px;font-weight:600;border:2px solid transparent}
.fbox small{display:block;font-family:var(--sans);font-weight:400;font-size:13px;margin-top:8px;color:rgba(0,0,0,.55)}
.f-trigger{background:var(--orange);color:var(--navy)}
.f-mid{background:#e8edf0;color:var(--navy)}
.f-out{background:#7fc8ef;color:var(--navy)}
.farrow{font-size:30px;color:var(--orange);font-weight:700}
.fexc{margin:10px auto 0;text-align:center;font-family:var(--mono);font-size:17px;color:var(--bad);background:rgba(255,123,135,.1);border:1.5px dashed rgba(255,123,135,.5);border-radius:12px;padding:12px 30px;width:fit-content}

/* footer */
.foot{position:absolute;bottom:26px;left:84px;right:84px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--faint);font-family:var(--mono)}
.foot .logo{display:flex;gap:8px;align-items:center;font-family:var(--sans);font-weight:600;color:var(--muted)}
.foot .logo b{color:var(--orange)}

/* title slide */
.s-title .bigfish{margin-bottom:34px}
.s-title h1{font-size:64px;margin:0 0 18px;font-weight:700;letter-spacing:-1.5px;line-height:1.08}
.s-title h1 em{color:var(--orange);font-style:normal}
.s-title .sub{font-size:24px;color:var(--muted);margin:0 0 40px;max-width:820px}
.s-title .meta{font-size:17px;color:var(--faint);font-family:var(--mono)}
.s-title .meta b{color:var(--ink);font-weight:600}

/* section divider slides */
.s-div .center h2{font-size:56px}
.s-div .secnum{font-family:var(--mono);font-size:120px;font-weight:600;color:rgba(238,153,47,.18);line-height:1;margin-bottom:6px}

/* quote slide */
.quote{font-size:40px;font-weight:600;line-height:1.35;max-width:980px;letter-spacing:-.5px}
.quote em{color:var(--orange);font-style:normal}

/* chrome: progress + counter + help */
#bar{position:fixed;bottom:0;left:0;height:5px;background:linear-gradient(90deg,var(--orange),#ffbf69);width:0;z-index:10;transition:width .2s}
#counter{position:fixed;bottom:14px;right:20px;font-family:var(--mono);font-size:13px;color:var(--faint);z-index:10}
#help{position:fixed;top:16px;left:20px;font-family:var(--mono);font-size:12px;color:rgba(255,255,255,.25);z-index:10}
#presenter-btn{position:fixed;bottom:12px;left:20px;z-index:10;background:var(--navy-soft);color:var(--ink);border:1px solid var(--orange);border-radius:8px;padding:7px 14px;font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer}
#presenter-btn:hover{background:#173047}
body.overview #presenter-btn{display:none}
body.overview #stage{display:none}
#grid{display:none}
body.overview #grid{display:grid;position:fixed;inset:0;overflow-y:auto;grid-template-columns:repeat(4,1fr);gap:14px;padding:20px;z-index:20;background:var(--navy-2)}
#grid .thumb{position:relative;aspect-ratio:16/9;border:1.5px solid rgba(255,255,255,.15);border-radius:10px;overflow:hidden;cursor:pointer;background:var(--navy)}
#grid .thumb:hover{border-color:var(--orange)}
#grid .thumb .t-label{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;padding:10px;text-align:center}
#grid .thumb .t-num{font-family:var(--mono);font-size:12px;color:var(--orange)}
#grid .thumb .t-title{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.3}

/* language switcher */
#langbar{position:fixed;top:12px;right:20px;z-index:30;display:flex;gap:6px}
#langbar button{display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.16);border-radius:8px;padding:5px 8px;line-height:0;cursor:pointer;opacity:.5;transition:opacity .15s,border-color .15s,background .15s}
#langbar button svg{display:block;border-radius:2px}
#langbar button:hover{opacity:.9;background:rgba(255,255,255,.12)}
#langbar button.active{opacity:1;border-color:var(--orange);background:rgba(238,153,47,.18)}
body.overview #langbar{display:flex}
</style>
</head>
<body>
<div id="langbar"></div>
<div id="stage"></div>
<div id="grid"></div>
<div id="bar"></div><div id="counter"></div>
<div id="help">← → navigate · O overview · P presenter · F fullscreen</div>
<button id="presenter-btn" title="Open speaker notes in a second window (P) — open it BEFORE fullscreen">▸ Presenter</button>

<script>
/* ── tiny highlighter (same as tutorial) ── */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function hlJava(src){
  const re=/(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\])*")|(@[A-Za-z_]\w*)|\b(public|private|protected|abstract|class|interface|record|enum|extends|implements|return|void|new|if|else|for|while|switch|case|default|try|catch|finally|throw|throws|import|package|static|final|volatile|boolean|int|long|double|float|null|true|false|this|var|instanceof)\b|((?<![\w.])\d[\d_]*(?:\.\d+)?)/g;
  let out='',last=0,m;
  while((m=re.exec(src))){out+=esc(src.slice(last,m.index));
    const c=m[1]?'cmt':m[2]?'str':m[3]?'ann':m[4]?'kw':'num';
    out+='<span class="tok-'+c+'">'+esc(m[0])+'</span>';last=m.index+m[0].length;}
  return out+esc(src.slice(last));
}
function hlProps(src){return src.split('\n').map(l=>{
  if(/^\s*#/.test(l))return '<span class="tok-cmt">'+esc(l)+'</span>';
  const i=l.indexOf('=');if(i<0)return esc(l);
  return '<span class="tok-key">'+esc(l.slice(0,i))+'</span>=<span class="tok-val">'+esc(l.slice(i+1))+'</span>';}).join('\n');}
function java(code,sm){return '<pre'+(sm?' class="sm"':'')+'><code>'+hlJava(code)+'</code></pre>';}
function props(code,sm){return '<pre'+(sm?' class="sm"':'')+'><code>'+hlProps(code)+'</code></pre>';}
function txt(code,sm){return '<pre'+(sm?' class="sm"':'')+'><code>'+esc(code)+'</code></pre>';}

const fish='<svg width="86" height="86" viewBox="0 0 34 34" fill="none"><rect width="34" height="34" rx="8" fill="#ee992f"/><path d="M6 17c3.2-4.6 7.6-7 12.2-7 3.4 0 6.6 1.3 9.3 3.8l-2.3 3.2 2.3 3.2c-2.7 2.5-5.9 3.8-9.3 3.8-4.6 0-9-2.4-12.2-7z" fill="#001b27"/><circle cx="22.6" cy="15.4" r="1.5" fill="#ee992f"/></svg>';

/* ═══════════════════ SLIDES ═══════════════════ */
const DECKS = { en: [], pt: [], es: [] };
const LANG_META = { en: "<svg viewBox=\"0 0 24 16\" width=\"23\" height=\"15\" aria-hidden=\"true\"><rect width=\"24\" height=\"16\" fill=\"#fff\"/><g fill=\"#b22234\"><rect width=\"24\" height=\"1.23\"/><rect y=\"2.46\" width=\"24\" height=\"1.23\"/><rect y=\"4.92\" width=\"24\" height=\"1.23\"/><rect y=\"7.38\" width=\"24\" height=\"1.23\"/><rect y=\"9.85\" width=\"24\" height=\"1.23\"/><rect y=\"12.31\" width=\"24\" height=\"1.23\"/><rect y=\"14.77\" width=\"24\" height=\"1.23\"/></g><rect width=\"9.6\" height=\"8.62\" fill=\"#3c3b6e\"/><g fill=\"#fff\"><circle cx=\"1.0\" cy=\"1.1\" r=\".42\"/><circle cx=\"2.9\" cy=\"1.1\" r=\".42\"/><circle cx=\"4.8\" cy=\"1.1\" r=\".42\"/><circle cx=\"6.7\" cy=\"1.1\" r=\".42\"/><circle cx=\"8.6\" cy=\"1.1\" r=\".42\"/><circle cx=\"1.0\" cy=\"3.2\" r=\".42\"/><circle cx=\"2.9\" cy=\"3.2\" r=\".42\"/><circle cx=\"4.8\" cy=\"3.2\" r=\".42\"/><circle cx=\"6.7\" cy=\"3.2\" r=\".42\"/><circle cx=\"8.6\" cy=\"3.2\" r=\".42\"/><circle cx=\"1.0\" cy=\"5.3\" r=\".42\"/><circle cx=\"2.9\" cy=\"5.3\" r=\".42\"/><circle cx=\"4.8\" cy=\"5.3\" r=\".42\"/><circle cx=\"6.7\" cy=\"5.3\" r=\".42\"/><circle cx=\"8.6\" cy=\"5.3\" r=\".42\"/><circle cx=\"1.0\" cy=\"7.4\" r=\".42\"/><circle cx=\"2.9\" cy=\"7.4\" r=\".42\"/><circle cx=\"4.8\" cy=\"7.4\" r=\".42\"/><circle cx=\"6.7\" cy=\"7.4\" r=\".42\"/><circle cx=\"8.6\" cy=\"7.4\" r=\".42\"/></g></svg>", es: "<svg viewBox=\"0 0 24 16\" width=\"23\" height=\"15\" aria-hidden=\"true\"><rect width=\"24\" height=\"16\" fill=\"#c60b1e\"/><rect y=\"4\" width=\"24\" height=\"8\" fill=\"#ffc400\"/></svg>", pt: "<svg viewBox=\"0 0 24 16\" width=\"23\" height=\"15\" aria-hidden=\"true\"><rect width=\"24\" height=\"16\" fill=\"#009b3a\"/><path d=\"M12 2.2 21.4 8 12 13.8 2.6 8Z\" fill=\"#fedf00\"/><circle cx=\"12\" cy=\"8\" r=\"3.4\" fill=\"#002776\"/><path d=\"M8.7 7.2c2.3-1.1 4.9-.6 6.7 1.2\" stroke=\"#fff\" stroke-width=\".9\" fill=\"none\"/></svg>" };
const LANG_NAME = { en: 'English', es: 'Espa\u00f1ol', pt: 'Portugu\u00eas' };
let __L = 'en';
function S(title, html, cls){ DECKS[__L].push({title, html, cls: cls||''}); }

/* 1 — Title */
S('Title', `
<div class="center s-title-inner">
  <div class="bigfish">${fish}</div>
  <h1>Jakarta <em>Agentic AI</em></h1>
  <p class="sub">A vendor-neutral Jakarta EE specification for building AI agents —
  and its first implementation, inside Payara Server.</p>
  <p class="meta"><b>Luís Neto</b> · Payara Conference · August 2026</p>
</div>`, 's-title');

/* 2 — Agenda */
S('Agenda', `
<p class="kicker">Agenda</p>
<h2>Where we are going</h2>
<div class="cols grow"><div class="col">
  <div class="card"><h3>1 · The problem</h3><p>Every Java AI framework speaks its own dialect</p></div>
  <div class="card"><h3>2 · The specification</h3><p>Agents as CDI beans, a workflow of phases, one LLM facade</p></div>
  <div class="card"><h3>3 · Demo — Quickstart</h3><p>Four phases live, on a free local model (Ollama)</p></div>

  <div class="card"><h3>6 · Demo — Course Content Studio</h3><p>Two agents chained by events: approve, then publish for the student</p></div>
  <div class="card"><h3>7 · TCK &amp; the road ahead</h3><p>How compatibility is proven; what 2.0 may bring</p></div>
</div></div>`);

/* 3 — The problem */
S('The problem', `
<p class="kicker">The problem</p>
<h2>Everyone wants agents.<br>Java gives you <em>five ways to get locked in</em>.</h2>
<div class="grow"><ul>
  <li><strong>Vendor lock-in</strong> — switching the LLM provider or framework means rewriting agent code</li>
  <li><strong>No container integration</strong> — DI, scopes, events, validation, transactions… reinvented per framework</li>
  <li><strong>Ad-hoc workflows</strong> — every app builds its own state machine around the LLM calls</li>
</ul>
<p class="muted" style="margin-top:26px">LangChain4j, Spring AI, Semantic Kernel… all excellent — all <strong>proprietary programming models</strong>.</p>
</div>`);

/* 4 — Quote */
S('The pitch', `
<div class="center">
  <p class="quote">“What would the <em>Jakarta Persistence</em><br>of AI agents look like?”</p>
  <p class="muted" style="margin-top:30px;font-size:20px">Program against a standard API.<br>Let the server provide the engine and the provider.</p>
</div>`, 's-div');

/* 5 — LangChain4j swap */
S('Swap: LangChain4j', `
<p class="kicker">Switching GPT → Claude</p>
<h2>World 1 — LangChain4j: <em>recompile</em></h2>
<div class="cols grow">
  <div class="col"><p class="panel-label">Before — pom: langchain4j-open-ai</p>
  ${java(`ChatModel model = OpenAiChatModel.builder()
    .apiKey(System.getenv("OPENAI_API_KEY"))
    .modelName("gpt-4o")

  <div class="col"><p class="panel-label">After — pom: langchain4j-anthropic</p>
  ${java(`ChatModel model = AnthropicChatModel.builder()
    .apiKey(System.getenv("ANTHROPIC_API_KEY"))
    .modelName("claude-opus-4-8")
    .build();`)}</div>
</div>
<p class="small muted" style="margin-top:20px">New dependency + new wiring code + rebuild + redeploy. The abstraction belongs to <strong>one vendor's library</strong> — not to a standard.</p>`);

/* 6 — Spring AI swap */
S('Swap: Spring AI', `
<p class="kicker">Switching GPT → Claude</p>
<h2>World 2 — Spring AI: <em>swap the starter</em></h2>
<div class="grow">
${txt(`pom.xml:      spring-ai-starter-model-openai  →  spring-ai-starter-model-anthropic
properties:   spring.ai.openai.*              →  spring.ai.anthropic.*`)}
<ul style="margin-top:26px">
  <li><span class="check">✓</span> The <code>ChatClient</code> code can stay the same — fair to acknowledge</li>
  <li><span class="cross">✗</span> Still an application <strong>rebuild</strong></li>
  <li><span class="cross">✗</span> The abstraction only exists <strong>inside Spring</strong> — single implementation</li>
  <li><span class="cross">✗</span> No spec, no TCK guaranteeing portable behavior</li>
</ul></div>`);

/* 7 — Jakarta swap */
S('Swap: Jakarta Agentic AI', `
<p class="kicker">Switching GPT → Claude</p>
<h2>World 3 — Jakarta Agentic AI: <em>edit one file</em></h2>
<div class="cols grow">
  <div class="col"><p class="panel-label">Agent code — no vendor anywhere</p>
  ${java(`@Agent
public class QuestionAgent {

  @Inject
  LargeLanguageModel model;  // jakarta.ai.agent

  @Action
  void generate(Question q, AnswerStore out) {
    out.put(q.text(),
      model.query("Answer concisely: {}", q.text()));
  }
}`,true)}</div>
  <div class="col"><p class="panel-label">microprofile-config.properties — the whole migration</p>
  ${props(`# BEFORE
payara.agentic.llm.provider=ollama
payara.agentic.llm.model=gemma3:4b

# AFTER
payara.agentic.llm.provider=anthropic

  <p class="small muted">Zero code changes · zero pom changes<br>(the provider backend lives in the <strong>server</strong>, not the WAR)</p></div>

/* 8 — Spec at a glance */
S('The spec at a glance', `
<p class="kicker">The specification</p>
<h2>Small API, real spec</h2>
<div class="cols grow">
<div class="col">
  <table>
    <tr><th>Module</th><th>Contents</th></tr>
    <tr><td><code>api/</code></td><td>7 annotations · 1 interface · 1 record · 1 exception</td></tr>
    <tr><td><code>spec/</code></td><td>Specification document (AsciiDoc)</td></tr>
    <tr><td><code>tck/</code></td><td>Compatibility tests, tied to requirements</td></tr>
    <tr><td><code>examples/</code></td><td>Five runnable examples — the three demos included</td></tr>
  </table>
</div>
<div class="col">
  <div class="card"><h3>Design decisions</h3><ul>
    <li><strong>CDI-first</strong> — agents are beans, triggers are CDI events</li>
    <li><strong>JSON-B</strong> for serialization — portable across vendors</li>
    <li>Java 17 · Jakarta EE 10 · CDI 4.0</li>
    <li>Minimal LLM facade — JPA-style provider evolution</li>
  </ul></div>
</div></div>`);

/* 9 — Phase model */
S('The phase model', `
<p class="kicker">The specification</p>
<h2>A workflow of <em>phases</em></h2>
<div class="grow">
<div class="flow">
  <div class="fbox f-trigger">@Trigger<small>required · exactly 1<br>CDI event</small></div><div class="farrow">→</div>
  <div class="fbox f-mid">@Decision<small>0..N · may stop<br>the workflow</small></div><div class="farrow">→</div>
  <div class="fbox f-mid">@Action<small>0..N · the<br>real work</small></div><div class="farrow">→</div>
  <div class="fbox f-out">@Outcome<small>0..1 · void ·<br>ends the context</small></div>
</div>
<div class="fexc">@HandleException — catches exceptions from ANY phase</div>
<ul style="margin-top:30px">
  <li>Decisions &amp; actions <strong>intermix freely</strong> — serial gates, not if/else trees</li>
  <li>Data flows between phases <strong>by type</strong> — no manual parameter passing</li>
  <li>One <code>@WorkflowScoped</code> context wraps every run — created and destroyed by the container</li>
</ul></div>`);

/* 10 — Complete agent */
S('A complete agent', `
<p class="kicker">The specification</p>
<h2>A complete agent fits on one slide</h2>
${java(`@Agent(name = "QuestionAgent", description = "Answers a question with the configured LLM.")
public class QuestionAgent {

    @Inject LargeLanguageModel model;
    @Inject AnswerStore answers;

    @Trigger
    void onQuestion(@Valid Question question) { }                       // entry: CDI event

    @Decision
    Result hasContent(Question q) {                                     // gate
        return new Result(q.text() != null && !q.text().isBlank(), q);
    }

    @Action
    void generate(Question q) {                                         // the work

/* 11 — Scopes */
S('Two scopes', `
<p class="kicker">The specification</p>
<h2>Two scopes — and <em>only</em> two</h2>
<table style="margin-bottom:22px">
  <tr><th></th><th>@WorkflowScoped (default)</th><th>@ApplicationScoped</th></tr>
  <tr><td><strong>Instance</strong></td><td>New per execution — dies after the outcome</td><td>One, shared, app lifetime</td></tr>
  <tr><td><strong>Fields</strong></td><td>Private scratchpad, no locking needed</td><td>Shared — must be thread-safe</td></tr>
  <tr><td><strong>Plain <code>@Observes</code></strong></td><td><span class="cross">✗ deployment error</span></td><td><span class="check">✓ allowed</span></td></tr>
</table>
<div class="card"><h3>Why not request / session / dependent?</h3>
<p class="small">Triggers fire from timers, batches, messages — no HTTP there. Agents are never injected, so <code>@Dependent</code> has no owner. The only real question is: is field state <strong>per run</strong> or <strong>shared</strong>? Two answers → two scopes.</p></div>
<p class="small muted" style="margin-top:14px">Either way: the <strong>LLM conversation is always per workflow</strong> — even on a singleton agent.</p>`);

/* 13 — Decision patterns */
S('@Decision patterns', `
<p class="kicker">The specification</p>
<h2>@Decision — three return patterns</h2>
<table style="margin-bottom:24px">
  <tr><th>Return</th><th>Proceeds if…</th><th>Data propagated</th></tr>
  <tr><td><code>boolean</code></td><td><code>true</code></td><td>nothing — a pure gate</td></tr>
  <tr><td><code>Result</code></td><td><code>success() == true</code></td><td>the <code>details()</code> enters the context</td></tr>

/* 15 — Ordering */
S('Phase ordering', `
<p class="kicker">The specification</p>
<h2>Who runs first? Three rules, one consistency law</h2>
<div class="grow">
<ol style="font-size:22px">
  <li><code>@Priority</code> on the method — lower first, <strong>beats</strong> <code>order()</code></li>
  <li>The annotation's <code>order()</code> attribute — lower first</li>
  <li><strong>Source declaration order</strong> — when nothing is explicit<br>
      <span class="small muted">(reflection doesn't guarantee it — mainstream JVMs preserve it; Payara reads the <code>.class</code> methods table)</span></li>
</ol>
<div class="card" style="margin-top:26px"><h3>Consistency law</h3>
<p class="small">If <strong>any</strong> decision/action declares explicit ordering, <strong>all</strong> must — mixing is a <code>DefinitionException</code> at deployment. Tip: use steps of 10, avoid <code>order = 0</code> (it is the default).</p></div>

/* 16 — HandleException */
S('@HandleException', `
<p class="kicker">The specification</p>
<h2>@HandleException — recovery <em>with semantics</em></h2>
<div class="cols grow">
<div class="col">${java(`// recovery: return normally ⇒ workflow continues
@HandleException
void onTimeout(GatewayTimeoutException ex,
               PaymentRequest req, RetryQueue rq) {
  rq.enqueue(req);
  // @Outcome still runs as closure
}

// fatal: rethrow ⇒ workflow stops
@HandleException
void onPaymentError(PaymentException ex,
                    AuditLog audit) {
  audit.paymentFailed(ex);
  throw ex;
}`,true)}</div>
<div class="col"><ul class="small" style="font-size:17px">
  <li><strong>Most specific type wins</strong> — hierarchy, not declaration order</li>
  <li>Handlers receive the exception <strong>+ workflow state + CDI beans</strong></li>
  <li>Return normally = recovered ⇒ <strong>@Outcome runs</strong></li>
  <li>Throw = stop ⇒ exception reaches the container</li>
  <li><strong>No recursive handling</strong> — a handler's own exception is never re-dispatched</li>
  <li>An <code>Error</code> matches no <code>Exception</code> handler — straight to the container</li>
</ul></div></div>`);

/* 17 — Transactions */
S('Transactions', `
<p class="kicker">The specification · Q&amp;A favorite</p>
<h2>Undo side effects? Wrap the workflow in <em>your</em> transaction</h2>
<div class="cols grow">
<div class="col">${java(`@POST
@Transactional        // wraps the ENTIRE workflow
public Response apply(LoanApplication app) {
  trigger.fire(app);  // synchronous: all phases
  return Response.ok().build();
}`,true)}
${java(`@Decision
boolean offerViable(LoanOffer offer) {
  if (offer.rate() >= MAX_LEGAL_RATE)
    // NOT "return false" — that COMMITS!
    throw new OfferRejectedException(offer);
  return true;
}`,true)}</div>
<div class="col"><ul class="small" style="font-size:17px">
  <li>Works because <code>Event.fire</code> is <strong>synchronous</strong> and observers run in the caller's transaction</li>
  <li><strong>Early termination is normal completion ⇒ commit.</strong> Rollback needs an exception that <em>crosses</em> the engine</li>
  <li>A handler that recovers ⇒ commit too — design handlers and transactions <strong>together</strong></li>
  <li>Often better: move the gate before the side effect, or persist in <code>@Outcome</code></li>
</ul>
<p class="xsmall muted">1.0 doesn't define transactional semantics — this is the synchronous-execution consequence.</p></div></div>`);

/* 23 — Observes trick */
S('The @Observes trick', `
<p class="kicker">Inside Payara · the “aha!” moment</p>
<h2>Why the extension <em>removes</em> @Observes</h2>
<div class="cols grow">
<div class="col">
  <div class="card"><h3>If it stayed…</h3><ul>
    <li>CDI would invoke the trigger <strong>directly</strong> — as a plain observer</li>
    <li>No engine, no workflow context, no later phases</li>
    <li>Plus the engine's own observer ⇒ <strong>trigger invoked twice</strong></li>
  </ul></div>
</div>
<div class="col">
  <div class="card"><h3>Removed ⇒</h3><ul>
    <li>The <strong>synthetic observer</strong> becomes the single entry point</li>
    <li>The workflow context wraps the <strong>entire run</strong></li>

  </ul></div>
</div></div>
<p class="small muted" style="margin-top:18px">Same pattern for the LLM: the default is <strong>self-vetoing</strong> — if the app supplies a <code>LargeLanguageModel</code> (like the TCK stub), Payara registers none. App LLM always wins ⇒ no <code>AmbiguousResolutionException</code>, and tests run with zero network.</p>`);

/* 24 — Engine */
S('WorkflowEngine', `
<p class="kicker">Inside Payara</p>
<h2>The engine: one call runs the whole workflow</h2>
<div class="cols grow">
<div class="col">${java(`workflowScopeManager.activate();
ctx.add(triggerEvent);
try {
  agent = resolveBean(agentClass);
  llm   = resolveBean(LargeLanguageModel.class);
  ctx.add(invoke(trigger));
  for (PhaseMethod p : sortedPhases) {
    Object r = invoke(p);
    if (p.isDecision()) {
      if (!shouldContinue(r)) return;   // gate
      publish(r);                       // details()
    } else ctx.add(r);
  }
  invoke(outcome);
} catch (Exception e) {
  dispatchToHandler(e);   // most specific wins
} finally {
  workflowScopeManager.deactivate();    // ALWAYS
}`,true)}</div>
<div class="col"><ul class="small" style="font-size:17px">
  <li>Runs <strong>on the caller's thread</strong> — sync by design</li>
  <li>Parameter resolution: LLM → in-flight exception → context (newest first) → CDI bean</li>
  <li>Bean Validation on phase parameters (when a provider is present)</li>
  <li>Recovery runs <code>@Outcome</code> as closure — unless the outcome itself threw (<code>outcomeAttempted</code>)</li>
  <li><code>@WorkflowScoped</code> = <strong>ThreadLocal</strong> context ⇒ free isolation between concurrent workflows, <code>@PreDestroy</code> on deactivate</li>
</ul></div></div>`);

/* 23 — Truque do @Observes */
S('O truque do @Observes', `
<p class="kicker">Por dentro da Payara · o momento “aha!”</p>
<h2>Por que a extensão <em>remove</em> o @Observes</h2>
<div class="cols grow">
<div class="col">
  <div class="card"><h3>Se ficasse…</h3><ul>
    <li>O CDI invocaria o trigger <strong>diretamente</strong> — como observer comum</li>
    <li>Sem engine, sem contexto de workflow, sem as fases seguintes</li>
    <li>Somado ao observer do engine ⇒ <strong>trigger invocado duas vezes</strong></li>
  </ul></div>
</div>
<div class="col">
  <div class="card"><h3>Removido ⇒</h3><ul>
    <li>O <strong>observer sintético</strong> vira o único ponto de entrada</li>
    <li>O contexto de workflow envolve a <strong>execução inteira</strong></li>

  </ul></div>
</div></div>
<p class="small muted" style="margin-top:18px">Mesmo padrão para o LLM: o default é <strong>auto-vetado</strong> — se a app fornece um <code>LargeLanguageModel</code> (como o stub do TCK), a Payara não registra nenhum. O LLM da app sempre vence ⇒ sem <code>AmbiguousResolutionException</code>, e testes rodam com zero rede.</p>`);

/* 24 — Engine */
S('WorkflowEngine', `
<p class="kicker">Por dentro da Payara</p>
<h2>O engine: uma chamada roda o workflow inteiro</h2>
<div class="cols grow">
<div class="col">${java(`workflowScopeManager.activate();
ctx.add(triggerEvent);
try {
  agent = resolveBean(agentClass);
  llm   = resolveBean(LargeLanguageModel.class);
  ctx.add(invoke(trigger));
  for (PhaseMethod p : sortedPhases) {
    Object r = invoke(p);
    if (p.isDecision()) {
      if (!shouldContinue(r)) return;   // portão
      publish(r);                       // details()
    } else ctx.add(r);
  }
  invoke(outcome);
} catch (Exception e) {
  dispatchToHandler(e);   // mais específico vence
} finally {
  workflowScopeManager.deactivate();    // SEMPRE
}`,true)}</div>
<div class="col"><ul class="small" style="font-size:17px">
  <li>Roda <strong>na thread do chamador</strong> — síncrono por design</li>
  <li>Resolução de parâmetros: LLM → exceção em voo → contexto (mais recente primeiro) → bean CDI</li>
  <li>Bean Validation nos parâmetros das fases (quando há provider)</li>
  <li>Recuperação roda o <code>@Outcome</code> como fechamento — a menos que o próprio outcome tenha lançado (<code>outcomeAttempted</code>)</li>
  <li><code>@WorkflowScoped</code> = contexto em <strong>ThreadLocal</strong> ⇒ isolamento grátis entre workflows concorrentes, <code>@PreDestroy</code> no deactivate</li>
</ul></div></div>`);

/* 24 — Motor */
S('WorkflowEngine', `
<p class="kicker">Por dentro de Payara</p>
<h2>El motor: una llamada ejecuta el workflow entero</h2>
<div class="cols grow">
<div class="col">${java(`workflowScopeManager.activate();
ctx.add(triggerEvent);
try {
  agent = resolveBean(agentClass);
  llm   = resolveBean(LargeLanguageModel.class);
  ctx.add(invoke(trigger));
  for (PhaseMethod p : sortedPhases) {
    Object r = invoke(p);
    if (p.isDecision()) {
      if (!shouldContinue(r)) return;   // compuerta
      publish(r);                       // details()
    } else ctx.add(r);
  }
  invoke(outcome);
} catch (Exception e) {
  dispatchToHandler(e);   // gana el más específico
} finally {
  workflowScopeManager.deactivate();    // SIEMPRE
}`,true)}</div>
<div class="col"><ul class="small" style="font-size:17px">
  <li>Se ejecuta <strong>en el hilo del llamador</strong> — síncrono por diseño</li>
  <li>Resolución de parámetros: LLM → excepción en vuelo → contexto (más reciente primero) → bean CDI</li>
  <li>Bean Validation en los parámetros de fase (cuando hay proveedor)</li>
  <li>La recuperación ejecuta el <code>@Outcome</code> como cierre — salvo que el propio outcome lanzara (<code>outcomeAttempted</code>)</li>
  <li><code>@WorkflowScoped</code> = contexto en <strong>ThreadLocal</strong> ⇒ aislamiento gratuito entre workflows concurrentes, <code>@PreDestroy</code> al desactivar</li>
</ul></div></div>`);

S('Corrección del test + config', `
<p class="kicker">Demo 3 · Course Content Studio</p>
<h2>Preguntas abiertas, corregidas por el <em>LLM</em></h2>
<div class="cols grow">
<div class="col">${java(`// QuizQuestion.type = "multiple_choice" | "open"
// una respuesta abierta se corrige FUERA de todo agente:
@POST @Path("quiz/grade")
public Response grade(GradeRequest body) {
  int score = similarity(model,          // 0..100
      q.prompt(), q.sampleAnswer(),
      body.studentAnswer());
  String verdict = score >= 70 ? "correct"
      : score >= 50 ? "partial" : "incorrect";
  return Response.ok(...).build();
}`,true)}
<p class="small muted">La fachada es <code>@Dependent</code> ⇒ inyéctala directamente en un recurso <code>@RequestScoped</code> — <strong>no toda llamada al LLM necesita un agente</strong>.</p></div>
<div class="col"><ul class="small" style="font-size:17px">
  <li>Similitud <strong>≥ 70 correcta · 50–69 parcial · &lt; 50 incorrecta</strong> — umbrales aplicados en el <strong>servidor</strong>, no en el modelo</li>
  <li>MathJax está <strong>autoalojado</strong> en el WAR — las fórmulas se renderizan offline</li>
</ul>
${props(`payara.agentic.llm.provider=vertex
payara.agentic.llm.model=claude-sonnet-4-6
payara.agentic.llm.max-tokens=8192`)}
<p class="xsmall muted">Un modelo en la nube sobre el escenario — el backend local de Ollama agota los 120 s en un portátil.</p>
</div></div>`);

<div class="cols grow">

</ul></div>
<div class="col">
<p class="panel-label">Detectar una implementación — una property de opt-in</p>
${java(`Boolean.getBoolean(

</div></div>`);

  `Welcome and set the frame: "I'm Luís — today I want to show what it looks like when building AI agents becomes a Jakarta EE standard, not another framework. A spec, a real implementation inside Payara, and live samples." Breathe, smile, go.`,
  `Roadmap in one breath — the problem, the spec, three live demos woven through the implementation internals, then the TCK and where this is heading. Don't read every box; just signpost the three demos.`,
  `Everyone wants agents; Java gives you five ways to get locked in — vendor lock-in, no container integration, ad-hoc workflows. Name-drop LangChain4j, Spring AI, Semantic Kernel: all excellent, all proprietary programming models. That's the gap.`,
  `The one-liner of the whole talk: what would the Jakarta Persistence of AI agents look like? Program against a standard API; let the server provide the engine and the provider. Pause here — let it land.`,
  `World 1. To switch GPT to Claude in LangChain4j you change the builder AND the dependency, then rebuild. The abstraction belongs to one vendor's library — not a standard.`,
  `World 2, and be fair — Spring AI is nicer: swap the starter, the ChatClient code can stay. But it's still an application rebuild, still a single implementation inside Spring, and there's no spec or TCK guaranteeing portable behavior.`,
  `World 3 — the payoff. The agent code names no vendor. The entire migration is a properties file: provider ollama to anthropic. No code, no pom change — the backend lives in the server, not the WAR. This is the thesis; say it slowly.`,
  `Small API, real spec: four modules — api, spec, tck, examples. Seven annotations, one interface. Design decisions: CDI-first, JSON-B, Java 17 / Jakarta EE 10, and a minimal LLM facade that can evolve like JPA providers.`,
  `The core mental model — a workflow of phases: one required Trigger from a CDI event, zero-to-many Decisions and Actions that intermix freely, an optional Outcome, and HandleException across all of them. Data flows by type; one WorkflowScoped context wraps each run.`,
  `And it fits on one slide. Point at each phase. Emphasize: no vendor, no framework base class — just a CDI bean with annotated methods.`,
  `Only two scopes, deliberately. WorkflowScoped — new per run, private fields, no locking. ApplicationScoped — one shared instance, thread-safety on you, and it may be a regular observer. Punchline: the LLM conversation is always per workflow, even on a singleton.`,
  `A nice subtlety: the trigger can return data — a pre-analysis of the event — and that return enters the workflow context. Later phases just ask for it by type. Same mechanism carries decision and action returns forward. No manual wiring.`,
  `Decisions have three return shapes: boolean pure gate; Result — verdict plus data; or a domain object where non-null proceeds. And termination is a feature: false or null stops the workflow cleanly. Note: no rollback of side effects — bring your own transaction.`,
  `Multiple decisions are serial gates — a logical AND. They never call each other; they talk through the context, by type. Any gate failing cuts everything after it. And a decision can come after an action, to validate what it produced.`,
  `Who runs first: Priority beats order beats source declaration order. The one law — if any phase is explicitly ordered, all must be, or it's a deployment error. Tip: steps of 10, avoid order zero.`,
  `Recovery with semantics. Most specific exception type wins — hierarchy, not declaration order. Return normally means recovered, and the Outcome still runs. Throw means stop. And no recursive handling — a handler's own exception goes straight to the container.`,
  `A Q&A favorite. There's no transactional semantics in 1.0, but because fire is synchronous, a Transactional on the caller wraps the whole workflow. The catch: early termination is normal completion — it commits. To roll back you must throw, not return false.`,
  `One facade for every model — four query overloads plus unwrap, the JPA-style escape hatch. Placeholders are positional, params serialized with JSON-B. Typed responses deserialize JSON to your record. IllegalArgument is your fault; LLMException is the service's.`,
  `Drive the per-workflow point home: the second phase doesn't resend the ticket — the model remembers the earlier turn. WorkflowScoped: the conversation dies with the run. ApplicationScoped: histories stay isolated per workflow. Enforced by the TCK.`,
  `First demo — keep it tight: one agent, four phases, on a free local Ollama model, no network, no cost. Fire a REST POST and watch the log. (If short on time, narrate from the next slide instead of running it.)`,
  `Recap what happened: the POST fires a CDI event, the synthetic observer runs the engine on this thread, the four phases run, the context is destroyed. The whole thing — LLM call included — finishes before fire returns; that's why the answer ships in the same response.`,

  `The boot pipeline. ProcessAnnotatedType applies the default scope and removes @Observes from the trigger. ProcessManagedBean checks for an app-supplied LLM. AfterBeanDiscovery registers the context, one synthetic observer per agent, and the default LLM. Structural mistakes fail the deployment — fail fast.`,
  `The aha moment. If @Observes stayed, CDI would call the trigger directly — no engine, no context — and twice, because the engine also observes. Removing it makes the synthetic observer the single entry point. Same idea for the LLM: the default self-vetoes, so the app's LLM always wins and tests run offline.`,
  `One method runs everything: activate the context, resolve agent and LLM, run the trigger, loop the sorted phases with gate checks, run the outcome, dispatch handlers, and always deactivate. It's a ThreadLocal context — free isolation between concurrent workflows — which is what makes Payara a compatible implementation in the spec's sense.`,
  `The spec logic is written once in LargeLanguageModelImpl; underneath, a tiny LlmBackend SPI with NoOp, Ollama, Anthropic, Vertex. Selected by MicroProfile Config. Robustness: unknown provider falls back to NoOp; Anthropic without a key fails fast. No SDK — raw HttpClient — to avoid OSGi clashes. Prompt caching via cache_control.`,

  `Bienvenida y encuadre: «Soy Luís — hoy quiero enseñaros cómo se ve construir agentes de IA cuando eso se convierte en un estándar Jakarta EE, y no en otro framework más. Una spec, una implementación real dentro de Payara y samples en vivo.» Respira, sonríe, arranca.`,
  `El guion de un tirón — el problema, la spec, tres demos entretejidas con las tripas de la implementación, luego el TCK y hacia dónde va esto. No leas cada caja; solo señaliza las tres demos.`,
  `Todo el mundo quiere agentes; Java te da cinco formas de quedar atrapado — vendor lock-in, sin integración con el contenedor, workflows ad-hoc. Menciona LangChain4j, Spring AI, Semantic Kernel: todos excelentes, todos con modelo de programación propietario. Ese es el hueco.`,
  `La frase que resume toda la charla: ¿cómo sería el Jakarta Persistence de los agentes de IA? Programa contra una API estándar; deja que el servidor aporte el motor y el proveedor. Pausa aquí — deja que aterrice.`,
  `Mundo 1. Para cambiar GPT por Claude en LangChain4j cambias el builder Y la dependencia, y recompilas. La abstracción pertenece a la biblioteca de un proveedor — no a un estándar.`,
  `Mundo 2, y sé justo — Spring AI es más elegante: cambias el starter y el código del ChatClient puede quedarse. Pero sigue siendo una recompilación de la aplicación, sigue siendo una implementación única dentro de Spring, y no hay spec ni TCK que garanticen un comportamiento portable.`,
  `Mundo 3 — la recompensa. El código del agente no nombra ningún proveedor. La migración entera es un archivo de propiedades: provider de ollama a anthropic. Sin código, sin tocar el pom — el backend vive en el servidor, no en el WAR. Esta es la tesis; dila despacio.`,
  `API pequeña, spec de verdad: cuatro módulos — api, spec, tck, examples. Siete anotaciones, una interfaz. Decisiones de diseño: CDI primero, JSON-B, Java 17 / Jakarta EE 10, y una fachada de LLM mínima que puede evolucionar como los providers de JPA.`,
  `El modelo mental central — un workflow de fases: un Trigger obligatorio desde un evento CDI, cero o muchas Decisions y Actions que se intercalan libremente, un Outcome opcional y HandleException atravesándolo todo. Los datos fluyen por tipo; un contexto WorkflowScoped envuelve cada ejecución.`,
  `Y cabe en una sola diapositiva. Señala cada fase. Enfatiza: sin proveedor, sin clase base de framework — solo un bean CDI con métodos anotados.`,
  `Solo dos ámbitos, deliberadamente. WorkflowScoped — nuevo por ejecución, campos privados, sin bloqueos. ApplicationScoped — una instancia compartida, la seguridad de hilos a tu cargo, y puede ser observador normal. El remate: la conversación con el LLM es siempre por workflow, incluso en un singleton.`,
  `Una sutileza bonita: el trigger puede devolver datos — un preanálisis del evento — y ese retorno entra en el contexto del workflow. Las fases posteriores solo lo piden por tipo. El mismo mecanismo lleva adelante los retornos de decision y action. Ningún cableado manual.`,
  `Las decisions tienen tres formas de retorno: boolean como compuerta pura; Result — veredicto más dato; o un objeto de dominio donde no-nulo continúa. Y terminar es una funcionalidad: false o null detiene el workflow limpiamente. Ojo: sin rollback de efectos secundarios — trae tu propia transacción.`,
  `Varias decisions son compuertas en serie — un AND lógico. Nunca se llaman entre sí; hablan a través del contexto, por tipo. Que falle cualquier compuerta corta todo lo que viene después. Y una decision puede ir después de una action, para validar lo que produjo.`,
  `Quién va primero: Priority gana a order, que gana al orden de declaración en el fuente. La única ley — si alguna fase lleva orden explícito, todas deben llevarlo, o es error de despliegue. Consejo: pasos de 10, evita order cero.`,
  `Recuperación con semántica. Gana el tipo de excepción más específico — jerarquía, no orden de declaración. Retorno normal significa recuperado, y el Outcome se ejecuta igualmente. Lanzar significa parar. Y sin tratamiento recursivo — la excepción del propio handler va directa al contenedor.`,
  `Una favorita del Q&A. No hay semántica transaccional en la 1.0, pero como el fire es síncrono, un Transactional en el llamador envuelve el workflow entero. La trampa: la terminación anticipada es finalización normal — hace commit. Para hacer rollback tienes que lanzar, no devolver false.`,
  `Una fachada para todos los modelos — cuatro sobrecargas de query más unwrap, la válvula de escape estilo JPA. Los placeholders son posicionales, los parámetros se serializan con JSON-B. Las respuestas tipadas deserializan JSON a tu record. IllegalArgument es culpa tuya; LLMException es del servicio.`,
  `Machaca el punto del por-workflow: la segunda fase no reenvía el ticket — el modelo recuerda el turno anterior. WorkflowScoped: la conversación muere con la ejecución. ApplicationScoped: los historiales quedan aislados por workflow. Lo exige el TCK.`,
  `Primera demo — mantenla corta: un agente, cuatro fases, sobre un modelo Ollama local gratuito, sin red, sin coste. Dispara un POST REST y mira el log. (Si vas justo de tiempo, nárrala desde la siguiente diapositiva en lugar de ejecutarla.)`,
  `Recapitula lo que pasó: el POST dispara un evento CDI, el observador sintético ejecuta el motor en este hilo, corren las cuatro fases, se destruye el contexto. Todo — llamada al LLM incluida — termina antes de que el fire retorne; por eso la respuesta viaja en el mismo response.`,
  `Ahora las tripas — y la promesa: sin magia de bytecode, sin SPI propietaria. Una extensión CDI portable, un motor, backends enchufables.`,
  `El pipeline de arranque. ProcessAnnotatedType aplica el ámbito por defecto y elimina el @Observes del trigger. ProcessManagedBean comprueba si la app aporta un LLM. AfterBeanDiscovery registra el contexto, un observador sintético por agente y el LLM por defecto. Los errores estructurales tumban el despliegue — fallo rápido.`,
  `El momento ajá. Si el @Observes se quedara, CDI llamaría al trigger directamente — sin motor, sin contexto — y dos veces, porque el motor también observa. Eliminarlo hace del observador sintético el único punto de entrada. La misma idea para el LLM: el de por defecto se auto-veta, así que el LLM de la app siempre gana y las pruebas corren offline.`,
  `Un método lo ejecuta todo: activa el contexto, resuelve agente y LLM, ejecuta el trigger, recorre las fases ordenadas comprobando las compuertas, ejecuta el outcome, despacha handlers y siempre desactiva. Es un contexto en ThreadLocal — aislamiento gratuito entre workflows concurrentes — que es lo que convierte a Payara en una implementación compatible en el sentido de la spec.`,
  `La lógica de la spec se escribe una vez en LargeLanguageModelImpl; debajo, una SPI mínima LlmBackend con NoOp, Ollama, Anthropic, Vertex. Seleccionada por MicroProfile Config. Robustez: proveedor desconocido cae a NoOp; Anthropic sin key falla rápido. Sin SDK — HttpClient pelado — para evitar choques en OSGi. Prompt caching vía cache_control.`,
  `Segunda demo — un caso de uso real. Un agente escribe una guía campo a campo de un formulario web y después la refina por chat, con Claude. El patrón a observar: el evento lleva el modo, y el artefacto viaja en el prompt.`,
  `Las ideas que vale la pena robar: una fuente única de verdad para el formulario; el evento lleva generar-o-refinar; edita el artefacto, no la memoria; y tratamiento defensivo del LLM — quitar code fences, merge por campo. El proveedor es Claude en Vertex, mediante un bloque de config.`,
  `Tercera demo — y en la que más me voy a detener. Course Content Studio: dos agentes, encadenados por un evento CDI, con una compuerta de aprobación humana. Generar, refinar, aprobar-y-publicar, y luego la vista del alumno. Cambia a la aplicación en vivo ahora.`,
  `Después de la ejecución en vivo, aterriza la arquitectura aquí. CourseContentAgent escribe el paquete; aprobar dispara LessonApproved, que activa PublishAgent. Sin orquestador — la aprobación es el evento entre ambos. Fases ordenadas, memoria del workflow, parseo defensivo del cuestionario, progreso SSE en vivo.`,
  `Dos puntos de cierre de la demo. Las preguntas abiertas las corrige el LLM — una puntuación de similitud, con umbrales aplicados en el servidor — y esa llamada inyecta el LargeLanguageModel directamente en un recurso REST, sin agente, porque la fachada es @Dependent. Y la config: Vertex/Claude sonnet — un modelo en la nube, porque en local agotaría los 120 segundos.`,
  `Una spec es real cuando tiene un TCK. Las pruebas viajan en main para que las ejecute quien implementa; cada prueba mapea a un requisito vía @Assertion. Pruebas standalone por reflexión frente a pruebas desplegadas con Arquillian. Cómo distingue los dos mundos: una implementación que ejecuta el TCK define una system property, jakarta.ai.agent.tck.implementation.present. Es un opt-in explícito y no un sondeo del contenedor, porque sobre el baseline Jakarta EE 10 el BeanManager de CDI 4.0 no puede enumerar los contextos registrados.`,
  `Lo que la 1.0 se guarda a propósito: un trigger, solo triggers por evento CDI, compuertas lineales, config de proveedor específica de la implementación, ejecución síncrona. Candidatos para lo próximo: varios triggers, triggers por messaging/REST, selección estandarizada de proveedor — el camino de JPA — orquestación asíncrona y multiagente.`,
  `Si se llevan tres cosas: los agentes son beans CDI con un workflow de fases; neutralidad de proveedor real — Ollama a Claude a Vertex es un archivo de propiedades; y es una spec de verdad, con TCK e implementación en producción, no un papel.`,
  `Gracias — invita a preguntar. Ten a mano los enlaces del repositorio y de los samples. Respira y disfruta del Q&A.`,
];


let LANG = (function(){
  const q = new URLSearchParams(location.search).get('lang');
  if(q && DECKS[q] && DECKS[q].length) return q;
  try { const v = localStorage.getItem('jaai.deck.lang'); if(v && DECKS[v] && DECKS[v].length) return v; } catch(e){}
  return 'en';
})();
let slides = DECKS[LANG];
let NOTES  = NOTES_ALL[LANG];

/* Rough per-slide time budget in seconds; slide 29 (Demo 3) holds the live-demo time.
   Cumulative total ≈ 20 min. Tweak freely — the presenter shows per-slide + cumulative. */
const TIMES = [15,20,25,15,20,20,35,20,40,25,35,25,25,25,20,30,25,25,30,10,25,10,40,35,40,35,10,25,360,40,35,25,20,25,15];

/* ── Presenter window (press P): synced speaker notes + timer ── */
let presenterWin = null;
function syncPresenter(n){
  if(presenterWin && !presenterWin.closed) presenterWin.postMessage({ type:'slide', n:n }, '*');
}
function openPresenter(){
  if(presenterWin && !presenterWin.closed){ presenterWin.focus(); syncPresenter(cur); return; }
  presenterWin = window.open('', 'jaai-presenter', 'width=780,height=920');
  if(!presenterWin){ alert('Popup blocked — allow popups for this page, then press P again.'); return; }
  const data = 'const NOTES=' + JSON.stringify(NOTES) +
               ';const TITLES=' + JSON.stringify(slides.map(s => s.title)) +
               ';const TIMES=' + JSON.stringify(TIMES) +
               ';const TOTAL=' + slides.length + ';';
  const html = `<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<title>Presenter notes</title><style>
*{box-sizing:border-box}
body{margin:0;background:#0b1622;color:#e8edf0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:22px 26px 84px}
#hd{display:flex;justify-content:space-between;align-items:baseline;gap:16px;border-bottom:1px solid #24405a;padding-bottom:10px;margin-bottom:18px}
#pos{font-family:ui-monospace,Consolas,monospace;color:#ee992f;font-size:20px;font-weight:700;flex:none}
#title{font-size:22px;font-weight:600;text-align:right}
#note{font-size:26px;line-height:1.5}
#nextwrap{margin-top:26px;padding-top:14px;border-top:1px dashed #24405a}
#nextt{font-weight:600;color:#7fc8ef;font-size:14px;letter-spacing:.5px;text-transform:uppercase}
#nextnote{color:#9fb2bc;font-size:16px;line-height:1.45;margin-top:7px}
#tools{position:fixed;left:0;right:0;bottom:0;background:#08111b;border-top:1px solid #24405a;padding:10px 26px;display:flex;gap:12px;align-items:center}
#timer{font-family:ui-monospace,Consolas,monospace;font-size:24px;color:#5ad18a}
#target{font-family:ui-monospace,Consolas,monospace;font-size:15px;color:#9fb2bc;margin-right:auto}
#budget{color:#9fb2bc;font-size:13px;margin-left:auto}
button{background:#173047;color:#e8edf0;border:1px solid #2b5480;border-radius:8px;padding:8px 16px;font-size:14px;cursor:pointer}
button:hover{background:#1d3d59}
.hint{color:#6d8794;font-size:13px}
.muted{color:#6d8794}
</style></head><body>
<div id="hd"><span id="pos">– / –</span><span id="title"></span></div>
<div id="note"></div>
<div id="nextwrap"><div id="nextt"></div><div id="nextnote"></div></div>
<div id="tools">
  <span id="timer">00:00</span><span id="target">/ 00:00</span>
  <button id="startBtn">Start</button><button id="resetBtn">Reset</button>
  <span id="budget"></span>
</div>
<script>${data}
var elapsed=0,running=false,tid=null,curCum=0;
function $(id){return document.getElementById(id);}
function fmt(s){var m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x;}
function cumTo(n){var s=0;for(var i=0;i<n;i++){s+=TIMES[i]||0;}return s;}
function paint(){$('timer').style.color=(elapsed<=curCum?'#5ad18a':'#ffb454');}
function toggle(){running=!running;$('startBtn').textContent=running?'Pause':'Start';
  if(running){tid=setInterval(function(){elapsed++;$('timer').textContent=fmt(elapsed);paint();},1000);}else{clearInterval(tid);}}
function render(n){
  curCum=cumTo(n);
  $('pos').textContent=n+' / '+TOTAL;
  $('title').textContent=TITLES[n-1]||'';
  $('note').innerHTML=NOTES[n-1]||'<span class="muted">No notes for this slide.</span>';
  $('nextt').textContent=n<TOTAL?('Next  ›  '+TITLES[n]):'— last slide —';
  $('nextnote').textContent=n<TOTAL?(NOTES[n]||''):'';
  $('budget').textContent='this slide '+fmt(TIMES[n-1]||0)+'  ·  ← → change slide';
  $('target').textContent='/ '+fmt(curCum)+' target';
  paint();
}
window.addEventListener('message',function(e){var d=e.data||{};if(d.type==='slide')render(d.n);});
window.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();if(window.opener)opener.postMessage({type:'nav',dir:1},'*');}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();if(window.opener)opener.postMessage({type:'nav',dir:-1},'*');}
  else if(e.key===' '){e.preventDefault();toggle();}
});
$('startBtn').onclick=toggle;
$('resetBtn').onclick=function(){elapsed=0;$('timer').textContent=fmt(0);paint();};
if(window.opener)opener.postMessage({type:'hello'},'*');
<\/script></body></html>`;
  try {
    presenterWin.document.open();
    presenterWin.document.write(html);
    presenterWin.document.close();
    presenterWin.focus();
  } catch(err){
    alert('Could not write the presenter window: ' + err);
    return;
  }
  setTimeout(function(){
    if(!presenterWin || presenterWin.closed){
      alert('The presenter window was blocked. Allow pop-ups for this page, open it BEFORE going fullscreen (F), then click the "▸ Presenter" button again.');
    }
  }, 500);
}
window.addEventListener('message', e => {
  const d = e.data || {};
  if(d.type === 'hello') syncPresenter(cur);
  else if(d.type === 'nav') go(cur + (d.dir || 0));
});
document.getElementById('presenter-btn').onclick = openPresenter;

/* ═══════════════════ ENGINE ═══════════════════ */
const stage = document.getElementById('stage');
const grid = document.getElementById('grid');

function renderDeck(){
  stage.innerHTML = '';
  grid.innerHTML = '';
  slides.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'slide ' + s.cls;
    el.id = 'slide-' + (i + 1);
    el.innerHTML = s.html + (s.cls.includes('s-title') ? '' :
      '<div class="foot"><span class="logo">Jakarta <b>Agentic AI</b> · Payara Conference 2026</span><span>' + (i + 1) + ' / ' + slides.length + '</span></div>');
    stage.appendChild(el);
    const t = document.createElement('div');
    t.className = 'thumb';
    t.innerHTML = '<div class="t-label"><span class="t-num">' + (i + 1) + '</span><span class="t-title">' + s.title + '</span></div>';
    t.onclick = () => { document.body.classList.remove('overview'); go(i + 1); };
    grid.appendChild(t);
  });
}

/* language switcher: same slide index, same presenter window */
const langbar = document.getElementById('langbar');
['en', 'es', 'pt'].forEach(code => {
  if(!DECKS[code] || !DECKS[code].length) return;
  const b = document.createElement('button');
  b.type = 'button';
  b.dataset.lang = code;
  b.title = LANG_NAME[code];
  b.setAttribute('aria-label', LANG_NAME[code]);
  b.innerHTML = LANG_META[code];
  b.onclick = () => setLang(code);
  langbar.appendChild(b);
});
function paintLangbar(){
  langbar.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.lang === LANG));
}
function setLang(code){
  if(code === LANG || !DECKS[code] || !DECKS[code].length) return;
  const at = cur;
  LANG = code;
  slides = DECKS[code];
  NOTES = NOTES_ALL[code];
  try { localStorage.setItem('jaai.deck.lang', code); } catch(e){}
  document.documentElement.lang = code === 'pt' ? 'pt-BR' : code;
  const url = new URL(location.href);
  url.searchParams.set('lang', code);
  history.replaceState(null, '', url.pathname + url.search + '#' + at);
  renderDeck();
  paintLangbar();
  cur = 0;
  go(at);
  if(presenterWin && !presenterWin.closed){ presenterWin.close(); presenterWin = null; openPresenter(); }
}

let cur = 0;
function go(n){
  n = Math.min(Math.max(1, n), slides.length);
  if(n === cur) return;
  cur = n;
  document.querySelectorAll('.slide').forEach((el, i) => el.classList.toggle('active', i === n - 1));
  document.getElementById('bar').style.width = (n / slides.length * 100) + '%';
  document.getElementById('counter').textContent = n + ' / ' + slides.length;
  syncPresenter(n);
  history.replaceState(null, '', '#' + n);
}
function fit(){
  const s = Math.min(window.innerWidth / 1280, window.innerHeight / 720) * 0.985;
  stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
}
window.addEventListener('resize', fit);

window.addEventListener('keydown', e => {
  if(e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); go(cur + 1); }
  else if(e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(cur - 1); }
  else if(e.key === 'Home') go(1);
  else if(e.key === 'End') go(slides.length);
  else if(e.key === 'o' || e.key === 'O') document.body.classList.toggle('overview');
  else if(e.key === 'p' || e.key === 'P') openPresenter();
  else if(e.key === 'Escape') document.body.classList.remove('overview');
  else if(e.key === 'f' || e.key === 'F'){
    if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen();
  }
});
document.addEventListener('click', e => {
  if(document.body.classList.contains('overview')) return;
  // chrome buttons sit in the click-to-navigate margins — don't treat them as stage clicks
  if(e.target.closest && e.target.closest('#langbar, #presenter-btn')) return;
  if(e.clientX > window.innerWidth * 0.7) go(cur + 1);
  else if(e.clientX < window.innerWidth * 0.15) go(cur - 1);
});

renderDeck();
paintLangbar();
document.documentElement.lang = LANG === 'pt' ? 'pt-BR' : LANG;
fit();
go(parseInt(location.hash.slice(1)) || 1);
</script>
</body>
</html>
